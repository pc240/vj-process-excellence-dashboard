<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VJ Process Excellence AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #1f2937;
}

/* HEADER */

.header {
    background: linear-gradient(135deg, #111827, #1f2937);
    color: white;
    padding: 22px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-size: 24px;
    letter-spacing: .5px;
}

.header p {
    margin-top: 5px;
    font-size: 13px;
    color: #d1d5db;
}

/* FILTER AREA */

.filter-bar {
    background: white;
    margin: 20px auto;
    max-width: 1400px;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.filters {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

.filter-group label {
    font-size: 13px;
    font-weight: 600;
    color: #4b5563;
}

select {
    padding: 9px 35px 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: white;
    font-size: 14px;
    cursor: pointer;
}

.refresh-btn {
    border: none;
    background: #111827;
    color: white;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
}

.refresh-btn:hover {
    background: #374151;
}

/* MAIN */

.container {
    max-width: 1400px;
    margin: auto;
    padding: 0 20px 40px;
}

.filter-info {
    margin-bottom: 18px;
    font-size: 13px;
    color: #6b7280;
}

/* STORE GRID */

.store-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
}

.store-grid.single {
    grid-template-columns: 1fr;
}

.store-column {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.store-title {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 7px;
}

.store-description {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 20px;
}

/* PRIORITY */

.priority-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .7px;
    color: #6b7280;
    margin: 20px 0 8px;
}

/* AUDIT CARD */

.audit-card {
    border: 1px solid #e5e7eb;
    border-radius: 11px;
    margin-bottom: 13px;
    overflow: hidden;
    background: white;
}

.audit-header {
    padding: 17px;
    cursor: pointer;
    transition: background .2s;
}

.audit-header:hover {
    background: #f9fafb;
}

.audit-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
}

.audit-subtitle {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 13px;
}

.audit-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.average-box {
    display: flex;
    align-items: center;
    gap: 9px;
}

.average-label {
    font-size: 12px;
    color: #6b7280;
}

.average-value {
    font-size: 22px;
    font-weight: 700;
}

.status {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 20px;
}

.status-red {
    background: #fee2e2;
    color: #b91c1c;
}

.status-yellow {
    background: #fef3c7;
    color: #92400e;
}

.status-green {
    background: #dcfce7;
    color: #166534;
}

.expand-text {
    font-size: 11px;
    color: #4b5563;
    white-space: nowrap;
}

/* DETAILS */

.audit-details {
    display: none;
    padding: 0 17px 17px;
}

.audit-details.open {
    display: block;
}

.details-table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th {
    background: #f3f4f6;
    color: #374151;
    font-weight: 700;
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

td {
    padding: 10px 8px;
    border-bottom: 1px solid #eef0f2;
}

.average-row {
    background: #f9fafb;
    font-weight: 700;
}

.no-data {
    padding: 18px;
    background: #f9fafb;
    border-radius: 8px;
    color: #6b7280;
    font-size: 13px;
}

/* NO STORE DATA */

.empty-state {
    padding: 35px 20px;
    text-align: center;
    color: #6b7280;
    background: white;
    border-radius: 12px;
}

/* LOADING */

.loading {
    padding: 40px;
    text-align: center;
    color: #6b7280;
}

/* MOBILE */

@media (max-width: 900px) {

    .store-grid {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 18px;
    }

    .header h1 {
        font-size: 20px;
    }

    .container {
        padding: 0 12px 30px;
    }

    .filter-bar {
        margin: 12px;
    }

}

</style>
</head>


<body>

<!-- HEADER -->

<div class="header">

    <div>
        <h1>VJ PROCESS EXCELLENCE AI</h1>
        <p>Audit Compliance & Process Monitoring Dashboard</p>
    </div>

</div>


<!-- FILTER -->

<div class="filter-bar">

    <div class="filters">

        <div class="filter-group">

            <label for="storeSelect">
                Store
            </label>

            <select id="storeSelect">

                <option value="all">
                    All Stores
                </option>

                <option value="solan">
                    VJ Solan
                </option>

                <option value="rohru">
                    VJ Rohru
                </option>

            </select>

        </div>


        <div class="filter-group">

            <label for="monthSelect">
                Month
            </label>

            <select id="monthSelect">

                <option value="2026-07">
                    July 2026
                </option>

                <option value="2026-08">
                    August 2026
                </option>

                <option value="2026-09">
                    September 2026
                </option>

                <option value="2026-10">
                    October 2026
                </option>

            </select>

        </div>

    </div>


    <button
        class="refresh-btn"
        onclick="loadDashboard()"
    >
        ↻ Refresh
    </button>

</div>


<!-- MAIN -->

<div class="container">

    <div
        class="filter-info"
        id="filterInfo"
    >
        Showing July 2026 only.
    </div>


    <div
        id="dashboard"
        class="store-grid"
    >

        <div class="loading">
            Loading dashboard...
        </div>

    </div>

</div>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzu-LJ_EXJwbCuK0zhc52C6Ptg41ORpID3JrDdbkqH1A-zAE4S1bazx1b1ZNeUA6J9a/exec";


/* =========================================================
   MONTH NAMES
========================================================= */

const MONTH_NAMES = {

    "01": "January",
    "02": "February",
    "03": "March",
    "04": "April",
    "05": "May",
    "06": "June",
    "07": "July",
    "08": "August",
    "09": "September",
    "10": "October",
    "11": "November",
    "12": "December"

};


/* =========================================================
   AUDIT CONFIGURATION
========================================================= */

const AUDITS = {

    solan: [

        {
            priority: "MOST IMPORTANT",
            title: "SOP / Process Audit",
            subtitle: "SOP / Process Audit Checklist",
            categories: [
                "SOP Audit – Solan"
            ],
            type: "monthly"
        },

        {
            priority: "SECOND PRIORITY",
            title: "Selection SOP Audit",
            subtitle: "Selection SOP Audit Checklist",
            categories: [
                "Selection SOP Audit – Solan"
            ],
            type: "monthly"
        },

        {
            priority: "LEAST IMPORTANT",
            title: "Housekeeping & Washroom — Combined (Gold Section)",
            subtitle: "Gold Section Housekeeping + Washroom",
            categories: [
                "Housekeeping – GF",
                "Housekeeping – 1st Floor",
                "Housekeeping – 2nd Floor",
                "Housekeeping – 3rd Floor",
                "Housekeeping – 4th + 5th Floor",
                "Washroom Audit – Solan"
            ],
            type: "combined"
        },

        {
            priority: "LEAST IMPORTANT",
            title: "Housekeeping — Silver Branch",
            subtitle: "Silver Branch Housekeeping",
            categories: [
                "Housekeeping – Silver Branch"
            ],
            type: "weekly"
        }

    ],


    rohru: [

        {
            priority: "MOST IMPORTANT",
            title: "SOP / Process Audit",
            subtitle: "SOP / Process Audit Checklist (Monthly)",
            categories: [
                "SOP Audit – Rohru"
            ],
            type: "monthly"
        },

        {
            priority: "LEAST IMPORTANT",
            title: "Housekeeping — VJ Rohru",
            subtitle: "Housekeeping — VJ Rohru",
            categories: [
                "Housekeeping – Rohru"
            ],
            type: "weekly"
        }

    ]

};


/* =========================================================
   STATUS
========================================================= */

function getStatus(compliance) {

    compliance = Number(compliance) || 0;

    if (compliance >= 76) {
        return {
            text: "GREEN",
            className: "status-green"
        };
    }

    if (compliance >= 70) {
        return {
            text: "YELLOW",
            className: "status-yellow"
        };
    }

    return {
        text: "RED",
        className: "status-red"
    };

}


/* =========================================================
   MONTH FORMAT
========================================================= */

function formatMonth(value) {

    const parts = value.split("-");

    return MONTH_NAMES[parts[1]] + " " + parts[0];

}


/* =========================================================
   DATE HELPERS
========================================================= */

function getRecordMonth(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
        return "";
    }

    return (
        date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2, "0")
    );

}


/* =========================================================
   FILTER RECORDS
========================================================= */

function filterRecords(records, selectedMonth) {

    if (!Array.isArray(records)) {
        return [];
    }

    return records.filter(record => {

        return getRecordMonth(record.date) === selectedMonth;

    });

}


/* =========================================================
   AVERAGE
========================================================= */

function calculateAverage(records) {

    if (!records.length) {
        return 0;
    }

    const total = records.reduce(
        (sum, record) =>
            sum + Number(record.compliance || 0),
        0
    );

    return total / records.length;

}


/* =========================================================
   COMBINED GOLD SECTION
========================================================= */

function createCombinedRecords(plan, categories, selectedMonth) {

    const recordsByCategory = {};

    categories.forEach(category => {

        const item = plan.find(
            p => p.category === category
        );

        recordsByCategory[category] =
            item && Array.isArray(item.records)
                ? filterRecords(item.records, selectedMonth)
                : [];

    });


    /*
       For the combined Gold section, records from the
       different housekeeping floors and washroom checklist
       are combined by date.

       If exact maxScore is available from API, it is used.
       Otherwise compliance values are averaged.
    */

    const allDates = new Set();

    categories.forEach(category => {

        recordsByCategory[category].forEach(record => {

            allDates.add(
                record.date
            );

        });

    });


    const combined = [];

    allDates.forEach(date => {

        const dayRecords = [];

        categories.forEach(category => {

            const record =
                recordsByCategory[category]
                .find(r => r.date === date);

            if (record) {
                dayRecords.push(record);
            }

        });


        if (!dayRecords.length) {
            return;
        }


        let totalScore = 0;
        let totalMax = 0;
        let hasMax = true;

        dayRecords.forEach(record => {

            totalScore +=
                Number(record.score || 0);

            if (
                record.maxScore !== undefined &&
                record.maxScore !== null
            ) {

                totalMax +=
                    Number(record.maxScore);

            } else {

                hasMax = false;

            }

        });


        let compliance;


        if (hasMax && totalMax > 0) {

            compliance =
                (totalScore / totalMax) * 100;

        } else {

            compliance =
                dayRecords.reduce(
                    (sum, r) =>
                        sum + Number(r.compliance || 0),
                    0
                ) / dayRecords.length;

        }


        combined.push({

            date: date,

            score: Math.round(totalScore * 100) / 100,

            compliance:
                Math.round(compliance * 10) / 10

        });

    });


    return combined.sort(
        (a, b) =>
            new Date(a.date) -
            new Date(b.date)
    );

}


/* =========================================================
   NORMAL RECORDS
========================================================= */

function getNormalRecords(
    plan,
    categories,
    selectedMonth
) {

    let records = [];

    categories.forEach(category => {

        const item =
            plan.find(
                p => p.category === category
            );

        if (
            item &&
            Array.isArray(item.records)
        ) {

            records =
                records.concat(
                    filterRecords(
                        item.records,
                        selectedMonth
                    )
                );

        }

    });


    return records.sort(
        (a, b) =>
            new Date(a.date) -
            new Date(b.date)
    );

}


/* =========================================================
   DATE LABEL
========================================================= */

function formatDate(dateValue) {

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
        return dateValue || "";
    }

    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================================
   CREATE AUDIT CARD
========================================================= */

function createAuditCard(
    audit,
    plan,
    selectedMonth
) {

    let records = [];


    if (audit.type === "combined") {

        records =
            createCombinedRecords(
                plan,
                audit.categories,
                selectedMonth
            );

    } else {

        records =
            getNormalRecords(
                plan,
                audit.categories,
                selectedMonth
            );

    }


    const card =
        document.createElement("div");

    card.className =
        "audit-card";


    /* ---------- HEADER ---------- */

    const header =
        document.createElement("div");

    header.className =
        "audit-header";


    const title =
        document.createElement("div");

    title.className =
        "audit-title";

    title.textContent =
        audit.title;


    const subtitle =
        document.createElement("div");

    subtitle.className =
        "audit-subtitle";

    subtitle.textContent =
        audit.subtitle;


    const summary =
        document.createElement("div");

    summary.className =
        "audit-summary";


    const averageBox =
        document.createElement("div");

    averageBox.className =
        "average-box";


    const averageLabel =
        document.createElement("span");

    averageLabel.className =
        "average-label";

    averageLabel.textContent =
        "Average Compliance";


    const averageValue =
        document.createElement("span");

    averageValue.className =
        "average-value";


    const expandText =
        document.createElement("span");

    expandText.className =
        "expand-text";


    /* ---------- NO DATA ---------- */

    if (!records.length) {

        averageValue.textContent =
            "No data";

        expandText.textContent =
            "No July submission";

        averageBox.appendChild(
            averageValue
        );

        summary.appendChild(
            averageBox
        );

        summary.appendChild(
            expandText
        );

        header.appendChild(title);
        header.appendChild(subtitle);
        header.appendChild(summary);

        card.appendChild(header);

        return card;

    }


    /* ---------- AVERAGE ---------- */

    const average =
        calculateAverage(records);


    const status =
        getStatus(average);


    averageValue.textContent =
        average.toFixed(1) + "%";


    const statusBadge =
        document.createElement("span");

    statusBadge.className =
        "status " + status.className;

    statusBadge.textContent =
        status.text;


    averageBox.appendChild(
        averageLabel
    );

    averageBox.appendChild(
        averageValue
    );

    averageBox.appendChild(
        statusBadge
    );


    expandText.textContent =
        "▼ View Audit Details";


    summary.appendChild(
        averageBox
    );

    summary.appendChild(
        expandText
    );


    header.appendChild(title);
    header.appendChild(subtitle);
    header.appendChild(summary);


    /* ---------- DETAILS ---------- */

    const details =
        document.createElement("div");

    details.className =
        "audit-details";


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "details-table-wrapper";


    const table =
        document.createElement("table");


    const thead =
        document.createElement("thead");

    const headerRow =
        document.createElement("tr");


    const firstHeader =
        document.createElement("th");

    firstHeader.textContent =
        audit.type === "weekly"
            ? "Week"
            : "Month";


    const scoreHeader =
        document.createElement("th");

    scoreHeader.textContent =
        "Score";


    const complianceHeader =
        document.createElement("th");

    complianceHeader.textContent =
        "Compliance";


    const statusHeader =
        document.createElement("th");

    statusHeader.textContent =
        "Status";


    headerRow.appendChild(
        firstHeader
    );

    headerRow.appendChild(
        scoreHeader
    );

    headerRow.appendChild(
        complianceHeader
    );

    headerRow.appendChild(
        statusHeader
    );

    thead.appendChild(
        headerRow
    );

    table.appendChild(
        thead
    );


    const tbody =
        document.createElement("tbody");


    /* ---------- DATA ROWS ---------- */

    records.forEach(record => {

        const row =
            document.createElement("tr");


        const dateCell =
            document.createElement("td");

        dateCell.textContent =
            audit.type === "weekly"
                ? formatDate(record.date)
                : formatMonth(
                    getRecordMonth(
                        record.date
                    )
                );


        const scoreCell =
            document.createElement("td");

        scoreCell.textContent =
            record.score ?? "-";


        const complianceCell =
            document.createElement("td");

        const compliance =
            Number(
                record.compliance || 0
            );

        complianceCell.textContent =
            compliance.toFixed(1) + "%";


        const rowStatus =
            getStatus(compliance);


        const statusCell =
            document.createElement("td");


        const rowBadge =
            document.createElement("span");

        rowBadge.className =
            "status " +
            rowStatus.className;

        rowBadge.textContent =
            rowStatus.text;


        statusCell.appendChild(
            rowBadge
        );


        row.appendChild(
            dateCell
        );

        row.appendChild(
            scoreCell
        );

        row.appendChild(
            complianceCell
        );

        row.appendChild(
            statusCell
        );


        tbody.appendChild(
            row
        );

    });


    /* ---------- AVERAGE ROW ---------- */

    const averageRow =
        document.createElement("tr");

    averageRow.className =
        "average-row";


    const averageLabelCell =
        document.createElement("td");

    averageLabelCell.textContent =
        "Average";


    const emptyScoreCell =
        document.createElement("td");

    emptyScoreCell.textContent =
        "";


    const averageComplianceCell =
        document.createElement("td");

    averageComplianceCell.textContent =
        average.toFixed(1) + "%";


    const averageStatusCell =
        document.createElement("td");


    const averageBadge =
        document.createElement("span");

    averageBadge.className =
        "status " +
        status.className;

    averageBadge.textContent =
        status.text;


    averageStatusCell.appendChild(
        averageBadge
    );


    averageRow.appendChild(
        averageLabelCell
    );

    averageRow.appendChild(
        emptyScoreCell
    );

    averageRow.appendChild(
        averageComplianceCell
    );

    averageRow.appendChild(
        averageStatusCell
    );


    tbody.appendChild(
        averageRow
    );


    table.appendChild(
        tbody
    );

    wrapper.appendChild(
        table
    );

    details.appendChild(
        wrapper
    );


    /* ---------- CLICK TO EXPAND ---------- */

    header.addEventListener(
        "click",
        () => {

            const isOpen =
                details.classList.contains(
                    "open"
                );


            if (isOpen) {

                details.classList.remove(
                    "open"
                );

                expandText.textContent =
                    "▼ View Audit Details";

            } else {

                details.classList.add(
                    "open"
                );

                expandText.textContent =
                    "▲ Hide Audit Details";

            }

        }
    );


    card.appendChild(
        header
    );

    card.appendChild(
        details
    );


    return card;

}


/* =========================================================
   STORE COLUMN
========================================================= */

function createStoreColumn(
    store,
    plan,
    selectedMonth
) {

    const column =
        document.createElement("div");

    column.className =
        "store-column";


    const title =
        document.createElement("div");

    title.className =
        "store-title";

    title.textContent =
        store === "solan"
            ? "VJ Solan"
            : "VJ Rohru";


    const description =
        document.createElement("div");

    description.className =
        "store-description";

    description.textContent =
        "Audits below are ordered by criticality, not blended into one score.";


    column.appendChild(title);
    column.appendChild(description);


    AUDITS[store].forEach(audit => {

        const priority =
            document.createElement(
                "div"
            );

        priority.className =
            "priority-label";

        priority.textContent =
            audit.priority;


        column.appendChild(
            priority
        );


        if (
            store === "rohru" &&
            audit.title ===
                "Housekeeping — VJ Rohru"
        ) {

            const note =
                document.createElement(
                    "div"
                );

            note.className =
                "audit-subtitle";

            note.textContent =
                "No separate Washroom checklist runs at Rohru, so there is nothing to combine here.";

            column.appendChild(
                note
            );

        }


        column.appendChild(
            createAuditCard(
                audit,
                plan,
                selectedMonth
            )
        );

    });


    return column;

}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadDashboard() {

    const dashboard =
        document.getElementById(
            "dashboard"
        );


    const selectedStore =
        document.getElementById(
            "storeSelect"
        ).value;


    const selectedMonth =
        document.getElementById(
            "monthSelect"
        ).value;


    const monthText =
        formatMonth(
            selectedMonth
        );


    document.getElementById(
        "filterInfo"
    ).textContent =
        "Showing " +
        monthText +
        " only. Audits with no " +
        monthText +
        " submission show \"No data\".";


    dashboard.innerHTML =
        '<div class="loading">Loading dashboard...</div>';


    try {

        const response =
            await fetch(
                API_URL +
                "?month=" +
                encodeURIComponent(
                    selectedMonth
                )
            );


        if (!response.ok) {
            throw new Error(
                "API request failed"
            );
        }


        const data =
            await response.json();


        const plan =
            Array.isArray(data.plan)
                ? data.plan
                : [];


        dashboard.innerHTML = "";


        if (
            selectedStore === "all"
        ) {

            dashboard.classList.remove(
                "single"
            );


            dashboard.appendChild(
                createStoreColumn(
                    "solan",
                    plan,
                    selectedMonth
                )
            );


            dashboard.appendChild(
                createStoreColumn(
                    "rohru",
                    plan,
                    selectedMonth
                )
            );

        } else {

            dashboard.classList.add(
                "single"
            );


            dashboard.appendChild(
                createStoreColumn(
                    selectedStore,
                    plan,
                    selectedMonth
                )
            );

        }

    } catch (error) {

        console.error(error);


        dashboard.innerHTML = `
            <div class="empty-state">
                <strong>Unable to load dashboard</strong>
                <br><br>
                Please click Refresh and try again.
            </div>
        `;

    }

}


/* =========================================================
   FILTER EVENTS
========================================================= */

document
    .getElementById("storeSelect")
    .addEventListener(
        "change",
        loadDashboard
    );


document
    .getElementById("monthSelect")
    .addEventListener(
        "change",
        loadDashboard
    );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadDashboard();

</script>

</body>
</html>
