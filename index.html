<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Verma Jewellers — Store-wise Compliance Dashboard</title>
<style>
  :root{
    --dark:#0F2A4D;
    --dark2:#173a66;
    --gold:#B8962E;
    --cream:#F5F0E8;
    --charcoal:#2D2D2D;
    --champagne:#E8D9B0;
    --warmgray:#7A7060;
    --white:#FFFFFF;
    --green:#1F7A4D;
    --green-bg:#E7F3EC;
    --red:#B3352C;
    --red-bg:#FBEAE8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--charcoal);
    font-family:Calibri, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--dark);
    color:var(--white);
    padding:20px 20px 20px;
  }
  header .top-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  header .logo{
    width:46px;
    height:46px;
    border-radius:6px;
    flex-shrink:0;
  }
  header .brand{
    font-family:Cambria, Georgia, serif;
    color:var(--gold);
    font-size:22px;
    font-weight:bold;
    letter-spacing:0.5px;
  }
  header .tagline{
    color:var(--champagne);
    font-size:12px;
    margin-top:2px;
  }
  header h1{
    font-family:Cambria, Georgia, serif;
    font-size:19px;
    margin:14px 0 4px;
    font-weight:bold;
  }
  header .period{
    font-size:12px;
    color:#D8CBB8;
  }

  .store-tabs{
    display:flex;
    gap:8px;
    padding:14px 16px 0;
    background:var(--dark);
    overflow-x:auto;
  }
  .store-tab{
    flex:1;
    min-width:110px;
    text-align:center;
    padding:10px 8px;
    border-radius:8px 8px 0 0;
    background:var(--dark2);
    color:#C9D3E0;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    border:none;
    transition:background .15s ease, color .15s ease;
  }
  .store-tab.active{
    background:var(--cream);
    color:var(--dark);
  }
  .store-tab .sub{
    display:block;
    font-weight:normal;
    font-size:11px;
    margin-top:2px;
  }

  main{ padding:16px; max-width:900px; margin:0 auto; }

  .filter-bar{
    padding:14px 16px 0;
    max-width:900px;
    margin:0 auto;
    position:relative;
  }
  .filter-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:Calibri, sans-serif;
    font-size:13px;
    font-weight:bold;
    padding:9px 18px;
    border-radius:8px;
    border:1.5px solid var(--dark);
    background:var(--dark);
    color:var(--white);
    cursor:pointer;
    width:fit-content;
  }
  .filter-toggle .arrow{
    font-size:11px;
    transition:transform .15s ease;
  }
  .filter-toggle.open .arrow{ transform:rotate(180deg); }
  .filter-toggle .current{
    color:var(--champagne);
    font-weight:normal;
  }

  .filter-dropdown{
    display:none;
    flex-direction:column;
    margin-top:8px;
    border:1px solid #E3D9C6;
    border-radius:8px;
    overflow:hidden;
    background:var(--white);
    width:220px;
  }
  .filter-dropdown.open{ display:flex; }
  .filter-option{
    padding:11px 16px;
    font-size:13px;
    font-weight:bold;
    color:var(--charcoal);
    background:var(--white);
    border:none;
    border-bottom:1px solid #EFE8D9;
    text-align:left;
    cursor:pointer;
  }
  .filter-option:last-child{ border-bottom:none; }
  .filter-option.active{
    background:var(--champagne);
    color:var(--dark);
  }
  .filter-note{
    font-size:11.5px;
    color:var(--warmgray);
    margin-top:8px;
  }

  .store-panel{ display:none; }
  .store-panel.active{ display:block; }

  .store-heading{
    font-family:Cambria, Georgia, serif;
    font-size:17px;
    font-weight:bold;
    color:var(--dark);
    margin:4px 0 2px;
  }
  .store-subnote{
    font-size:12px;
    color:var(--warmgray);
    margin-bottom:16px;
  }

  .priority-group{ margin-bottom:22px; }
  .priority-heading{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .priority-tag{
    font-size:10.5px;
    font-weight:bold;
    padding:3px 10px;
    border-radius:12px;
    letter-spacing:0.2px;
  }
  .priority-tag.tier1{ background:var(--dark); color:var(--white); }
  .priority-tag.tier2{ background:var(--champagne); color:var(--dark); }
  .priority-tag.tier3{ background:#EFE8DD; color:var(--warmgray); }
  .priority-heading .tier-label{
    font-size:12.5px;
    font-weight:bold;
    color:var(--charcoal);
  }
  .freq-pill{
    font-family:Calibri, sans-serif;
    font-size:10.5px;
    font-weight:bold;
    color:var(--warmgray);
    background:#EFE8DD;
    padding:2px 9px;
    border-radius:12px;
    margin-left:auto;
  }

  .audit-card{
    background:var(--white);
    border-radius:8px;
    border-left:5px solid var(--red);
    margin-bottom:10px;
    overflow:hidden;
    border:1px solid #E9E1D2;
  }
  .audit-card.pass{ border-left-color:var(--green); }

  .audit-card .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    cursor:pointer;
  }
  .audit-card .name{
    font-size:13.5px;
    font-weight:bold;
    color:var(--charcoal);
  }
  .audit-card .meta{
    font-size:11px;
    color:var(--warmgray);
    margin-top:2px;
    font-weight:normal;
  }
  .audit-card .score{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .audit-card .pct{
    font-size:16px;
    font-weight:bold;
  }
  .pass .pct{ color:var(--green); }
  .audit-card:not(.pass) .pct{ color:var(--red); }
  .chevron{
    font-size:11px;
    color:var(--warmgray);
    transition:transform .15s ease;
  }
  .audit-card.open .chevron{ transform:rotate(180deg); }

  .detail{
    display:none;
    padding:0 14px 14px;
  }
  .audit-card.open .detail{ display:block; }
  .detail .combine-note{
    font-size:11.5px;
    color:var(--warmgray);
    margin-bottom:8px;
    font-style:italic;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }
  th{
    background:var(--champagne);
    color:var(--dark);
    text-align:left;
    padding:6px 8px;
    font-weight:bold;
  }
  td{
    padding:6px 8px;
    border-bottom:1px solid #EFE8D9;
  }
  tr:last-child td{ border-bottom:none; }
  tr.avg-row td{
    font-weight:bold;
    border-top:1px solid var(--gold);
    background:#FBF8F1;
  }
  .status-pill{
    font-size:10.5px;
    font-weight:bold;
    padding:2px 8px;
    border-radius:10px;
  }
  .status-pill.green{ background:var(--green-bg); color:var(--green); }
  .status-pill.red{ background:var(--red-bg); color:var(--red); }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--warmgray);
    padding:20px 16px 30px;
  }
  footer .rule{
    width:60px;
    height:2px;
    background:var(--gold);
    margin:0 auto 10px;
  }

  @media (max-width:420px){
    .store-tab{ font-size:12px; min-width:90px; }
    header h1{ font-size:16px; }
  }

  html{ color-scheme:light; }
  body{ background:var(--cream); }
  header{ padding-top:calc(20px + env(safe-area-inset-top, 0px)); }
  footer{ padding-bottom:calc(30px + env(safe-area-inset-bottom, 0px)); }
  .filter-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .import-btn{
    font-family:Calibri, sans-serif; font-size:13px; font-weight:bold;
    padding:9px 16px; border-radius:8px; border:1.5px solid var(--gold);
    background:var(--champagne); color:var(--dark); cursor:pointer;
  }
  .import-panel{ max-width:900px; margin:12px auto 0; padding:0 16px; }
  .import-panel > *{ }
  .import-panel{ }
  .import-msg{ background:var(--green-bg); color:var(--green); border-left:4px solid var(--green); padding:10px 14px; font-size:13px; border-radius:4px; margin-bottom:8px; }
  .import-title{ font-family:Cambria, Georgia, serif; font-weight:bold; color:var(--dark); font-size:15px; margin:6px 0; }
  .import-file{ background:var(--white); border:1px solid #E3D9C6; border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:12px; }
  .import-file .fname{ font-weight:bold; color:var(--charcoal); word-break:break-all; }
  .import-file .fmeta{ color:var(--warmgray); margin:2px 0 6px; }
  .import-file select{ font-family:Calibri, sans-serif; font-size:12.5px; padding:5px 8px; border-radius:6px; border:1px solid #D9CDB4; margin-bottom:6px; }
  .irow{ font-size:11.5px; color:var(--charcoal); padding:2px 0; }
  .irow.bad{ color:var(--red); }
  .import-actions{ display:flex; gap:14px; align-items:center; margin:8px 0 4px; }
  .import-go{ font-family:Calibri, sans-serif; font-size:13px; font-weight:bold; padding:9px 18px; border-radius:8px; border:none; background:var(--dark); color:var(--white); cursor:pointer; }
  .import-go:disabled{ opacity:.4; cursor:not-allowed; }
  .link-btn{ background:none; border:none; color:var(--dark); font-family:Calibri, sans-serif; font-size:12.5px; font-weight:bold; cursor:pointer; padding:4px 0; text-decoration:underline; }
  .imported-box{ max-width:900px; margin:0 auto; padding:0 16px 10px; font-size:12px; }
  .imported-box table{ margin-top:6px; background:var(--white); }
  .del-btn{ font-size:11px; border:1px solid #D9CDB4; background:var(--white); border-radius:6px; padding:3px 8px; cursor:pointer; color:var(--red); }
  .filter-note{ min-height:16px; }
</style>
</head>

const LAYOUT = {
  solan: {
    title: "VJ Solan",
    note: "Covers both the Gold and Silver sections of the Solan store. Audits below are ordered by criticality, not blended into one score \u2014 each checks a different risk and shouldn't be averaged together.",
    groups: [
      {tier:1, tag:"MOST IMPORTANT", label:"SOP / Process Audit", freq:"Weekly", cards:[{id:"sop-solan", type:"simple", kind:"sop", store:"solan", name:"SOP / Process Audit Checklist"}]},
      {tier:2, tag:"SECOND PRIORITY", label:"Selection SOP Audit", freq:"Weekly", cards:[{id:"sel-solan", type:"simple", kind:"sel", store:"solan", name:"Selection SOP Audit"}]},
      {tier:3, tag:"LEAST IMPORTANT", label:"Housekeeping", freq:"Weekly", cards:[
        {id:"hkw-solan", type:"combo", store:"solan", name:"Housekeeping & Washroom \u2014 Combined (Gold Section)"},
        {id:"hk-silver", type:"simple", kind:"hk", store:"silver", name:"Housekeeping \u2014 Silver Section", extra:"no separate Washroom checklist here, so nothing to combine"}
      ]}
    ]
  },
  rohru: {
    title: "VJ Rohru",
    note: "Audits below are ordered by criticality, not blended into one score.",
    groups: [
      {tier:1, tag:"MOST IMPORTANT", label:"SOP / Process Audit", freq:"Monthly", cards:[{id:"sop-rohru", type:"simple", kind:"sop", store:"rohru", name:"SOP / Process Audit Checklist (Monthly)", monthly:true}]},
      {tier:3, tag:"LEAST IMPORTANT", label:"Housekeeping", freq:"Weekly", note:"No separate Washroom checklist runs at Rohru, so there is nothing to combine here.", cards:[{id:"hk-rohru", type:"simple", kind:"hk", store:"rohru", name:"Housekeeping \u2014 VJ Rohru"}]}
    ]
  }
};

// ---------- State ----------
let sheetRows = [], sheetStatus = "", sheetBusy = false;
let db = null, canWrite = false, dbRows = [], dbReady = false, localMode = false;
const LS_KEY = "vj_compliance_submissions_v1";
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; } }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(dbRows)); return true; } catch (e) { return false; } }

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (d) => { const [y,m,dd] = d.split("-"); return dd + " " + MON[+m-1] + " " + y; };
const fmtMonth = (k) => { const [y,m] = k.split("-"); return MON[+m-1] + " " + y; };
const monthLabel = (k) => { const [y,m] = k.split("-"); return MONFULL[+m-1] + " " + y; };
const pctStr = (v) => v.toFixed(1) + "%";
const isGreen = (v) => v >= 75;

// ---------- Data assembly ----------
function allEntries(){
  const out = [];
  const extra = dbRows.concat(sheetRows);
  const dbKeys = new Set(extra.map(r => r.kind + "|" + r.store + "|" + r.date));
  LEGACY.forEach((r,i) => {
    if (dbKeys.has(r[0] + "|" + r[1] + "|" + r[2])) return;       // imported data replaces baseline for that date
    out.push({kind:r[0], store:r[1], date:r[2], score:r[3], total:r[4], monthOnly:r[5]==="m", src:"base", id:"base"+i});
  });
  extra.forEach(r => out.push({kind:r.kind, store:r.store, date:r.date, score:+r.score, total:+r.total, monthOnly:false, src:"db", id:r.id, sid:r.sid}));
  return out;
}
function aggregate(list){           // sum areas submitted on the same date (housekeeping / washroom)
  const m = new Map();
  list.forEach(e => {
    const k = e.date;
    if (!m.has(k)) m.set(k, {date:e.date, score:0, total:0, monthOnly:e.monthOnly});
    const g = m.get(k); g.score += e.score; g.total += e.total;
  });
  return [...m.values()].sort((a,b) => a.date.localeCompare(b.date));
}
function simpleRows(entries, kind, store){
  let list = entries.filter(e => e.kind===kind && e.store===store);
  if (kind==="hk" || kind==="wash") return aggregate(list).map(r => ({...r, pct:r.score/r.total*100}));
  return list.sort((a,b) => a.date.localeCompare(b.date)).map(e => ({date:e.date, score:e.score, total:e.total, monthOnly:e.monthOnly, pct:e.score/e.total*100}));
}
function comboRows(entries, store){
  const hk = aggregate(entries.filter(e => e.kind==="hk" && e.store===store));
  const wa = aggregate(entries.filter(e => e.kind==="wash" && e.store===store));
  const dates = [...new Set([...hk.map(r=>r.date), ...wa.map(r=>r.date)])].sort();
  return dates.map(d => {
    const a = hk.find(r => r.date===d), b = wa.find(r => r.date===d);
    const num = (a?a.score:0) + (b?b.score:0), den = (a?a.total:0) + (b?b.total:0);
    return {date:d, a, b, pct:num/den*100, num, den};
  });
}
function monthsAvailable(entries){
  return [...new Set(entries.map(e => e.date.slice(0,7)))].sort();
}
const inMonth = (r) => view.month==="all" || r.date.slice(0,7)===view.month;

// ---------- Rendering ----------
function statusPill(v){ return '<span class="status-pill ' + (isGreen(v)?"green":"red") + '">' + (isGreen(v)?"GREEN":"RED") + '</span>'; }

function renderCard(card, entries){
  const open = view.open.has(card.id);
  let allRows, rows, avg = null, head, body = "";
  if (card.type==="combo"){
    allRows = comboRows(entries, card.store);
    rows = allRows.filter(inMonth);
    if (rows.length){ const n = rows.reduce((s,r)=>s+r.num,0), d = rows.reduce((s,r)=>s+r.den,0); avg = n/d*100; }
    head = "<tr><th>Week</th><th>HK Score</th><th>Washroom Score</th><th>Combined</th><th>Status</th></tr>";
    body = rows.map(r => "<tr><td>" + fmtDate(r.date) + "</td><td>" + (r.a ? r.a.score+"/"+r.a.total : "\u2014") + "</td><td>" + (r.b ? r.b.score+"/"+r.b.total : "\u2014") + "</td><td>" + pctStr(r.pct) + "</td><td>" + statusPill(r.pct) + "</td></tr>").join("");
  } else {
    allRows = simpleRows(entries, card.kind, card.store);
    rows = allRows.filter(inMonth);
    if (rows.length) avg = rows.reduce((s,r)=>s+r.pct,0)/rows.length;
    head = "<tr><th>" + (card.monthly ? "Month" : "Week") + "</th><th>Score</th><th>Compliance</th><th>Status</th></tr>";
    body = rows.map(r => "<tr><td>" + (r.monthOnly ? fmtMonth(r.date.slice(0,7)) : fmtDate(r.date)) + "</td><td>" + r.score + "</td><td>" + pctStr(r.pct) + "</td><td>" + statusPill(r.pct) + "</td></tr>").join("");
  }
  const ncols = card.type==="combo" ? 5 : 4;
  if (!rows.length) body = '<tr><td colspan="' + ncols + '" style="color:var(--warmgray)">No audit recorded in this period.</td></tr>';
  const avgCell = avg===null ? "\u2014" : pctStr(avg);
  const avgPill = avg===null ? '<span class="status-pill" style="background:#EFE8D9;color:var(--warmgray)">NO DATA</span>' : statusPill(avg);
  const avgRow = card.type==="combo"
    ? '<tr class="avg-row"><td>Average</td><td></td><td></td><td>' + avgCell + '</td><td>' + avgPill + '</td></tr>'
    : '<tr class="avg-row"><td>Average</td><td></td><td>' + avgCell + '</td><td>' + avgPill + '</td></tr>';
  const unit = card.monthly ? "month" : "week";
  const n = allRows.length;
  const meta = n + " " + unit + (n===1?"":"s") + " tracked" + (card.extra ? " \u00B7 " + card.extra : "") + (n ? " \u00B7 latest " + fmtDate(allRows[n-1].date) : "");
  const pass = avg!==null && isGreen(avg);
  const note = card.type==="combo" ? '<div class="combine-note">Housekeeping (all areas) and Washroom Housekeeping scores merged \u2014 points from both added together each week.</div>' : "";
  return '<div class="audit-card' + (pass?" pass":"") + (open?" open":"") + '">' +
    '<div class="row" data-toggle="' + card.id + '"><div><div class="name">' + esc(card.name) + '</div><div class="meta">' + esc(meta) + '</div></div>' +
    '<div class="score"><span class="pct">' + avgCell + '</span><span class="chevron">\u25BE</span></div></div>' +
    '<div class="detail">' + note + '<table>' + head + body + avgRow + '</table></div></div>';
}

function renderPanel(entries){
  const L = LAYOUT[view.store];
  let h = '<div class="store-heading">' + L.title + '</div><div class="store-subnote">' + L.note + '</div>';
  L.groups.forEach(g => {
    h += '<div class="priority-group"><div class="priority-heading"><span class="priority-tag tier' + g.tier + '">' + g.tag + '</span><span class="tier-label">' + g.label + '</span><span class="freq-pill">' + g.freq + '</span></div>';
    if (g.note) h += '<div class="store-subnote" style="margin:-4px 0 8px;">' + g.note + '</div>';
    g.cards.forEach(c => { h += renderCard(c, entries); });
    h += '</div>';
  });
  return h;
}

  if (view.month!=="all" && !months.includes(view.month)) view.month = "all";
  const allLabel = months.length>1 ? "All (" + MON[+months[0].slice(5)-1] + "\u2013" + MON[+months[months.length-1].slice(5)-1] + ")" : "All";
  const cur = view.month==="all" ? allLabel : monthLabel(view.month);
  let h = '<div class="filter-row"><button class="filter-toggle' + (view.dropdown?" open":"") + '" data-act="dd">Filter <span class="current">\u2014 ' + esc(cur) + '</span> <span class="arrow">\u25BE</span></button>';
  if (((db && canWrite) || localMode)) h += '<button class="import-btn" data-act="import">\uFF0B Import audits (CSV)</button>';
  h += '</div>';
  if (view.dropdown){
    h += '<div class="filter-dropdown open"><button class="filter-option' + (view.month==="all"?" active":"") + '" data-month="all">' + esc(allLabel) + '</button>';
    months.forEach(m => { h += '<button class="filter-option' + (view.month===m?" active":"") + '" data-month="' + m + '">' + monthLabel(m) + '</button>'; });
    h += '</div>';
  }
  if (SHEET_CSV_URL) h += '<div class="filter-note sheet-line">\uD83D\uDFE2 ' + esc(sheetStatus || "Connecting to Google Sheet\u2026") + ' <button class="link-btn" data-act="refresh">Refresh now</button></div>';
  if (localMode) h += '<div class="filter-note" style="color:var(--gold)">Offline mode: imported audits are saved in this browser only (not shared with others).</div>';
  h += '<div class="filter-note">' + (view.month==="all" ? "Showing all months. New months appear here automatically as audits are imported." : "Showing " + monthLabel(view.month) + " only. Audits with no submission that month show \u201CNo data\u201D.") + '</div>';
  return h;
}

    const rows = [...dbRows].sort((a,b) => b.date.localeCompare(a.date));
    h += '<table><tr><th>Date</th><th>Store</th><th>Audit</th><th>Score</th>' + (canWrite?"<th></th>":"") + '</tr>' +
      rows.map(r => '<tr><td>' + fmtDate(r.date) + '</td><td>' + esc(STORE_LABEL[r.store]||r.store) + '</td><td>' + esc(KIND_LABEL[r.kind]||r.kind) + '</td><td>' + r.score + '/' + r.total + '</td>' +
        (canWrite ? '<td><button class="del-btn" data-del="' + esc(r.id) + '">' + (confirmDel===r.id?"Sure? Remove":"Remove") + '</button></td>' : "") + '</tr>').join("") + '</table>';

function renderImportPanel(){
  if (!pending && !importMsg) return "";
  let h = '<div class="import-panel">';
  if (importMsg) h += '<div class="import-msg">' + importMsg + '</div>';
  if (pending){
    h += '<div class="import-title">Review before adding</div>';
    pending.files.forEach((f,i) => {

      h += '<div class="import-file"><div class="fname">' + esc(f.name) + '</div><div class="fmeta">' + f.rows.length + ' row(s) \u00B7 ' + valid + ' valid</div>' +

      f.rows.forEach(r => { h += '<div class="irow ' + (r.ok?"":"bad") + '">' + (r.date?fmtDate(r.date):"?") + ' \u00B7 ' + esc(r.storeRaw||"?") + ' \u00B7 ' + (r.ok ? r.score + "/" + r.total : esc(r.why)) + '</div>'; });
      h += '</div>';
    });
    const total = pending.files.reduce((s,f) => s + f.rows.filter(r=>r.ok).length, 0);

  } else {
    h += '<div class="import-actions"><button class="link-btn" data-act="cancel">Close</button></div>';
  }
  return h + '</div>';
}

// ---------- CSV import ----------
function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], cur = "", q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if (c==='"') q=true;
    else if (c===",") { row.push(cur); cur=""; }
    else if (c==="\n" || c==="\r"){ if (c==="\r" && text[i+1]==="\n") i++; row.push(cur); cur=""; if (row.length>1 || row[0]!=="") rows.push(row); row=[]; }
    else cur+=c;
  }
  if (cur!=="" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function guessKind(name){
  const n = name.toLowerCase();
  if (n.includes("washroom")) return "wash";
  if (n.includes("selection")) return "sel";
  if (n.includes("housek")) return "hk";
  if (n.includes("audit") || n.includes("sop") || n.includes("checklist")) return "sop";
  return "";
}
function mapStore(s){
  s = (s||"").toLowerCase();
  if (s.includes("silver")) return "silver";
  if (s.includes("rohru")) return "rohru";
  if (s.includes("solan")) return "solan";
  return "";
}
function parseDate(s){
  s = (s||"").trim(); let m;
  if ((m = s.match(/(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\s+(\d{4})/))){ const mi = MON.findIndex(x => x.toLowerCase()===m[2].toLowerCase()); if (mi>=0) return m[3] + "-" + String(mi+1).padStart(2,"0") + "-" + m[1].padStart(2,"0"); }
  if ((m = s.match(/(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if ((m = s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/))) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
  return "";
}
function knownTotal(kind, store){
  const t = allEntries().filter(e => e.kind===kind && e.store===store).map(e => e.total);
  return t.length ? Math.max(...t) : null;
}
function buildRows(f){
  f.rows = f.raw.map(o => {
    const r = {sid:o.sid, storeRaw:o.store, date:parseDate(o.date), store:mapStore(o.store), score:parseFloat(o.score), comp:parseFloat(o.comp), ok:false, why:""};
    if (!f.kind){ r.why = "file skipped"; return r; }
    if (!r.sid){ r.why = "no Submission Id"; return r; }
    if (!r.date){ r.why = "date not readable"; return r; }
    if (!r.store){ r.why = "unknown store"; return r; }
    if (!VALID[f.kind].includes(r.store)){ r.why = (STORE_LABEL[r.store]||r.store) + " has no " + KIND_LABEL[f.kind] + " card yet"; return r; }
    if (isNaN(r.score)){ r.why = "score missing"; return r; }
    let total = r.comp>0 ? Math.round(r.score*100/r.comp) : knownTotal(f.kind, r.store);
    if (!total){ r.why = "max score unknown (0%)"; return r; }
    r.total = total; r.ok = true; return r;
  });
}
async function readFiles(fileList){
  const files = [];
  for (const file of fileList){
    const rows = parseCSV(await file.text());
    if (rows.length < 2){ files.push({name:file.name, kind:"", raw:[], rows:[]}); continue; }
    const hdr = rows[0].map(h => h.trim().toLowerCase());
    const ix = (n) => hdr.indexOf(n);
    const iS = ix("submission id"), iD = ix("submitted for"), iT = ix("store"), iSc = ix("total score"), iC = ix("compliance");
    const raw = rows.slice(1).map(r => ({sid:(r[iS]||"").trim(), date:r[iD]||"", store:(r[iT]||"").trim(), score:r[iSc], comp:r[iC]}));
    const f = {name:file.name, kind:guessKind(file.name), raw, rows:[]};
    if (iS<0 || iD<0 || iT<0 || iSc<0 || iC<0){ f.kind = ""; f.raw = []; }
    buildRows(f); files.push(f);
  }
  pending = {files}; importMsg = ""; render();
}
async function commit(){
  const entriesBefore = monthsAvailable(allEntries());
  const jobs = [];
  pending.files.forEach(f => f.rows.filter(r => r.ok).forEach(r => jobs.push({kind:f.kind, r})));
  let done = 0, failed = 0, code = "";
  importMsg = "Adding " + jobs.length + " audit(s)\u2026"; pending = null; render();
  for (const j of jobs){
    const id = (j.kind + "-" + j.r.sid).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_");
    const body = {kind:j.kind, store:j.r.store, date:j.r.date, score:j.r.score, total:j.r.total, sid:j.r.sid, src:"csv"};
    if (localMode){ dbRows = dbRows.filter(x => x.id !== id); dbRows.push({id, ...body}); done++; continue; }
    try { await db.collection("submissions").doc(id).set(body); done++; }
    catch (e) { failed++; code = (e && e.code) || ""; }
  }
  const monthsAfter = [...new Set([...entriesBefore, ...jobs.map(j => j.r.date.slice(0,7))])].sort();
  const added = monthsAfter.filter(m => !entriesBefore.includes(m));
  if (localMode && !lsSave()){ failed = done; done = 0; code = "browser storage blocked"; }
  importMsg = "\u2714 " + done + " audit" + (done===1?"":"s") + " added." + (added.length ? " New month on dashboard: " + added.map(monthLabel).join(", ") + "." : "") + (failed ? " \u26A0 " + failed + " could not be saved" + (code? " (" + code + ")" : "") + "." : "");
  render();
}

// ---------- Events ----------
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-toggle],[data-act],[data-month],[data-del],.store-tab");
  if (!t) return;
  if (t.classList.contains("store-tab")){ view.store = t.dataset.store; render(); return; }
  if (t.dataset.toggle){ const id = t.dataset.toggle; view.open.has(id) ? view.open.delete(id) : view.open.add(id); render(); return; }
  if (t.dataset.month){ view.month = t.dataset.month; view.dropdown = false; render(); return; }
  if (t.dataset.del){
    if (confirmDel !== t.dataset.del){ confirmDel = t.dataset.del; render(); return; }
    confirmDel = null;
    if (localMode){ dbRows = dbRows.filter(x => x.id !== t.dataset.del); lsSave(); render(); return; }
    try { await db.collection("submissions").doc(t.dataset.del).delete(); } catch (e) { importMsg = "Could not remove that entry."; render(); }
    return;
  }
  const a = t.dataset.act;
  if (a==="dd"){ view.dropdown = !view.dropdown; render(); }
  else if (a==="import"){ $("csv-input").value = ""; $("csv-input").click(); }
  else if (a==="toggleImported"){ view.showImported = !view.showImported; confirmDel = null; render(); }
  else if (a==="refresh"){ loadSheet(); }
  else if (a==="cancel"){ pending = null; importMsg = ""; render(); }
  else if (a==="commit"){ commit(); }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id==="csv-input"){ if (t.files && t.files.length) readFiles(Array.from(t.files)); return; }
  if (t.dataset && t.dataset.kindsel!==undefined){ const f = pending.files[+t.dataset.kindsel]; f.kind = t.value; buildRows(f); render(); }
});

// ---------- Google Sheet live feed ----------
function sheetAudit(s){
  s = (s||"").toLowerCase();
  if (s.includes("washroom")) return "wash";
  if (s.includes("selection")) return "sel";
  if (s.includes("housek")) return "hk";
  if (s.includes("sop") || s.includes("process") || s.includes("audit")) return "sop";
  return "";
}
async function loadSheet(){
  if (!SHEET_CSV_URL || sheetBusy) return;
  sheetBusy = true; sheetStatus = "Refreshing\u2026"; render();
  try {
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const txt = await res.text();
    let rows;
    if (/^\s*[\[{]/.test(txt)){            // Apps Script Web App (JSON) feed
      const j = JSON.parse(txt);
      if (j && j.error) throw new Error(j.error);
      const list = Array.isArray(j) ? j : (j.rows || []);
      const S = (x) => x==null ? "" : String(x);
      rows = [["Submission Id","Date","Store","Audit","Score","Max Score","Compliance"]].concat(
        list.map(r => [S(r.submissionId), S(r.date), S(r.store), S(r.auditType || r.audit), S(r.score), S(r.total), S(r.compliance)]));
    } else rows = parseCSV(txt);
    if (rows.length < 1) throw new Error("empty");
    const hdr = rows[0].map(x => x.trim().toLowerCase());
    const find = (...names) => { for (const n of names){ const i = hdr.indexOf(n); if (i>=0) return i; } return -1; };
    const iSid = find("submission id","submissionid","id"), iDate = find("submitted for","date","audit date"), iStore = find("store"),
          iAud = find("audit","checklist","audit type"), iScore = find("total score","score"), iMax = find("max score","max","out of","total marks"), iComp = find("compliance","compliance %");
    if (iDate<0 || iStore<0 || iAud<0 || iScore<0) throw new Error("columns missing (need Date, Store, Audit, Score)");
    const seen = new Set(); const out = []; let skipped = 0;
    rows.slice(1).forEach((r, n) => {
      if (!r.some(c => c && c.trim())) return;
      const kind = sheetAudit(r[iAud]), store = mapStore(r[iStore]), date = parseDate(r[iDate]), score = parseFloat(r[iScore]);
      let total = iMax>=0 ? parseFloat(r[iMax]) : NaN;
      if (isNaN(total) && iComp>=0){ const c = parseFloat((r[iComp]||"").replace("%","")); if (c>0) total = Math.round(score*100/c); }
      if (!kind || !store || !date || isNaN(score) || !total || !VALID[kind].includes(store)){ skipped++; return; }
      const sid = iSid>=0 ? (r[iSid]||"").trim() : "";
      if (sid){ const k = kind + "|" + sid; if (seen.has(k)){ return; } seen.add(k); }
      out.push({id:"sheet" + n, kind, store, date, score, total, sid});
    });
    sheetRows = out;
    const t = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    sheetStatus = "Live from Google Sheet \u00B7 " + out.length + " audits \u00B7 checked " + t + (skipped ? " \u00B7 " + skipped + " row(s) skipped (check Audit/Store/Date)" : "");
  } catch (e) {
    sheetStatus = "Could not read Google Sheet (" + (e && e.message ? e.message : "error") + ") \u2014 showing last saved data. Check the Publish-to-web link.";
  }
  sheetBusy = false; render();
}

// ---------- Boot ----------
function startLocal(){ localMode = true; dbRows = lsLoad().filter(r => r.kind && r.store && r.date && r.total); render(); }
render();
loadSheet();
if (SHEET_CSV_URL) setInterval(loadSheet, SHEET_REFRESH_MINUTES * 60000);
(async () => {
  try {
    if (!(window.claude && window.claude.use)) { startLocal(); return; }
    db = await window.claude.use("db");
    if (!db) { startLocal(); return; }
    try { const user = await window.claude.use("user"); if (user) { const c = await user.can("data.write"); canWrite = c !== false; } else canWrite = true; } catch (e) { canWrite = true; }
    db.collection("submissions").onSnapshot((snap) => {
      dbRows = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(r => r.kind && r.store && r.date && r.total);
      dbReady = true; render();
    }, () => { dbRows = []; render(); });
    render();
  } catch (e) { startLocal(); }
})();
</script>
