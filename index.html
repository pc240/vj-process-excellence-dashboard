</head>


<body>


  <!-- HEADER -->

  <div class="header">

    <h1>
      VJ PROCESS EXCELLENCE AI
    </h1>

    <p>
      Verma Jewellers — Process & Audit Management Dashboard
    </p>

  </div>


  <!-- MAIN CONTAINER -->

  <div class="container">


    <!-- TOP BAR -->

    <div class="top-bar">

      <h2>
        Monthly Audit Dashboard
      </h2>


      <div class="controls">

        <select
          class="month-select"
          id="monthSelect"
        >

          <option value="2026-07">
            July 2026
          </option>

          <option value="2026-08">
            August 2026
          </option>

          <option value="2026-09">
            September 2026
          </option>

          <option value="2026-10">
            October 2026
          </option>

        </select>


        <button
          class="refresh-btn"
          onclick="loadDashboard()"
        >
          Refresh
        </button>

      </div>

    </div>


    <!-- ERROR -->

    <div
      id="errorBox"
      class="error"
    ></div>


    <!-- TOTAL AUDITS CARD -->

    <div class="cards">

      <div class="card">

        <div class="card-title">
          TOTAL AUDITS
        </div>

        <div
          class="card-value"
          id="totalAudits"
        >
          -
        </div>

      </div>

    </div>


    <!-- AUDIT DETAILS -->

    <div class="section">

      <h3>
        Actual Audits Completed
      </h3>


      <div
        id="loading"
        class="loading"
      >
        Loading live data...
      </div>


      <div
        id="auditDetails"
      ></div>


      <div
        class="last-updated"
        id="lastUpdated"
      ></div>

    </div>


  </div>



  <script>


    /* =========================
       GOOGLE APPS SCRIPT API
       ========================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzu-LJ_EXJwbCuK0zhc52C6Ptg41ORpID3JrDdbkqH1A-zAE4S1bazx1b1ZNeUA6J9a/exec";


    /*
      MAXIMUM SCORE

      Yahan category-wise maximum score define kiya gaya hai.

      IMPORTANT:
      Agar kisi audit ka actual maximum score alag hai,
      sirf yahan number change karna hoga.
    */

    const MAX_SCORES = {

      "SOP Audit – Solan": 165,

      "SOP Audit – Rohru": 165,

      "Selection SOP Audit – Solan": 165,

      "Housekeeping – GF": 14,

      "Housekeeping – 1st Floor": 14,

      "Housekeeping – 2nd Floor": 14,

      "Housekeeping – 3rd Floor": 14,

      "Housekeeping – 4th + 5th Floor": 13,

      "Housekeeping – Rohru": 17,

      "Washroom Audit – Solan": 12,

      "Housekeeping – Silver Branch": 14

    };


    /* =========================
       LOAD DASHBOARD
       ========================= */

    async function loadDashboard() {

      const loading =
        document.getElementById("loading");

      const details =
        document.getElementById("auditDetails");

      const errorBox =
        document.getElementById("errorBox");

      const selectedMonth =
        document.getElementById("monthSelect").value;


      loading.style.display = "block";

      details.innerHTML = "";

      errorBox.style.display = "none";


      try {

        const response =
          await fetch(
            API_URL +
            "?month=" +
            encodeURIComponent(selectedMonth)
          );


        if (!response.ok) {

          throw new Error(
            "API response failed"
          );

        }


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.error ||
            "Unable to load dashboard data"
          );

        }


        updateSummary(
          data.summary
        );


        updateAuditDetails(
          data.plan
        );


        loading.style.display =
          "none";


        document.getElementById(
          "lastUpdated"
        ).innerText =
          "Last updated: " +
          new Date().toLocaleString();

      }


      catch (error) {

        loading.style.display =
          "none";

        details.innerHTML = "";

        errorBox.innerText =
          "Unable to load live dashboard data. Please refresh the page.";

        errorBox.style.display =
          "block";

        console.error(
          "Dashboard Error:",
          error
        );

      }

    }



    /* =========================
       UPDATE SUMMARY
       ========================= */

    function updateSummary(summary) {

      document.getElementById(
        "totalAudits"
      ).innerText =
        summary.totalAudits ?? 0;

    }



    /* =========================
       FORMAT SCORE
       ========================= */

    function formatScore(
      score,
      category
    ) {

      if (
        score === null ||
        score === undefined ||
        score === ""
      ) {

        return "N/A";

      }


      const maximum =
        MAX_SCORES[category];


      if (
        maximum === undefined
      ) {

        return Number(score);

      }


      return (
        Number(score) +
        " / " +
        maximum
      );

    }



    /* =========================
       FORMAT STATUS
       ========================= */

    function getStatusClass(status) {

      if (!status) {
        return "status-na";
      }


      const value =
        String(status)
          .toUpperCase();


      if (value === "RED") {
        return "status-red";
      }


      if (value === "YELLOW") {
        return "status-yellow";
      }


      if (value === "GREEN") {
        return "status-green";
      }


      return "status-na";

    }



    /* =========================
       CREATE CATEGORY CARD
       ========================= */

    function createCategoryCard(item) {

      const card =
        document.createElement("div");

      card.className =
        "category-card";


      const records =
        item.records || [];


      const maximum =
        MAX_SCORES[item.category];


      let averageScoreText =
        "N/A";


      if (
        item.averageScore !== null &&
        item.averageScore !== undefined
      ) {

        if (maximum !== undefined) {

          averageScoreText =
            Number(item.averageScore) +
            " / " +
            maximum;

        }
        else {

          averageScoreText =
            Number(item.averageScore);

        }

      }


      let averageComplianceText =
        "N/A";


      if (
        item.averageCompliance !== null &&
        item.averageCompliance !== undefined
      ) {

        averageComplianceText =
          Number(
            item.averageCompliance
          ).toFixed(2) +
          "%";

      }


      let tableHTML = "";


      if (records.length === 0) {

        tableHTML = `

          <div class="no-records">

            No audits found for this category
            in the selected month.

          </div>

        `;

      }
      else {

        tableHTML = `

          <div class="table-wrapper">

            <table>

              <thead>

                <tr>

                  <th>
                    Date
                  </th>

                  <th>
                    Score
                  </th>

                  <th>
                    Compliance
                  </th>

                  <th>
                    Status
                  </th>

                </tr>

              </thead>

              <tbody>
        `;


        records.forEach(
          record => {

            const compliance =
              record.compliance !== null &&
              record.compliance !== undefined
                ? Number(
                    record.compliance
                  ).toFixed(2) + "%"
                : "N/A";


            const status =
              record.status || "N/A";


            const statusClass =
              getStatusClass(status);


            tableHTML += `

              <tr>

                <td>
                  ${record.date || "N/A"}
                </td>

                <td class="score-cell">
                  ${formatScore(
                    record.score,
                    item.category
                  )}
                </td>

                <td class="compliance-cell">
                  ${compliance}
                </td>

                <td>

                  <span
                    class="status ${statusClass}"
                  >
                    ${status}
                  </span>

                </td>

              </tr>

            `;

          }
        );


        /*
          AVERAGE ROW
        */

        tableHTML += `

              <tr class="average-row">

                <td>
                  Average
                </td>

                <td>

                  ${averageScoreText}

                </td>

                <td>

                  ${averageComplianceText}

                </td>

                <td>
                  —
                </td>

              </tr>

              </tbody>

            </table>

          </div>

        `;

      }


      card.innerHTML = `

        <div class="category-header">

          <div class="category-title-row">

            <div>

              <div class="category-title">

                ${item.category}

              </div>

              <div class="tracked">

                ${item.tracked ?? records.length}
                audit(s) tracked

              </div>

            </div>

          </div>


          <div class="category-summary">

            <div class="summary-item">

              <div class="summary-label">
                Audits Tracked
              </div>

              <div class="summary-value">

                ${item.tracked ?? records.length}

              </div>

            </div>


            <div class="summary-item">

              <div class="summary-label">
                Average Score
              </div>

              <div class="summary-value">

                ${averageScoreText}

              </div>

            </div>


            <div class="summary-item">

              <div class="summary-label">
                Average Compliance
              </div>

              <div class="summary-value">

                ${averageComplianceText}

              </div>

            </div>

          </div>

        </div>


        <div class="category-body">

          ${tableHTML}

        </div>

      `;


      return card;

    }



    /* =========================
       UPDATE AUDIT DETAILS
       ========================= */

    function updateAuditDetails(plan) {

      const container =
        document.getElementById(
          "auditDetails"
        );


      container.innerHTML = "";


      if (
        !plan ||
        plan.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">

            No audit data available
            for the selected month.

          </div>

        `;

        return;

      }


      plan.forEach(
        item => {

          const card =
            createCategoryCard(item);

          container.appendChild(card);

        }
      );

    }



    /* =========================
       MONTH CHANGE
       ========================= */

    document
      .getElementById("monthSelect")
      .addEventListener(
        "change",
        loadDashboard
      );



    /* =========================
       INITIAL LOAD
       ========================= */

    loadDashboard();


  </script>


</body>

</html>
```
