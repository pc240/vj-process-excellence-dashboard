<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VJ Process Excellence AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #172033;
      color: white;
      padding: 25px 35px;
    }

    .header h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.8;
    }

    .container {
      padding: 30px;
      max-width: 1450px;
      margin: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .top-bar h2 {
      font-size: 22px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .month-select,
    .refresh-btn {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      font-size: 14px;
    }

    .refresh-btn {
      cursor: pointer;
      background: #172033;
      color: white;
      border: none;
    }

    .refresh-btn:hover {
      opacity: 0.9;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 30px;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h3 {
      margin-bottom: 20px;
      font-size: 18px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f7f8fa;
      font-weight: bold;
    }

    .status {
      font-weight: bold;
    }

    .completed {
      color: #16803c;
    }

    .progress {
      color: #c47a00;
    }

    .not-started {
      color: #c62828;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e8ebef;
      border-radius: 20px;
      overflow: hidden;
      min-width: 100px;
    }

    .progress-fill {
      height: 100%;
      background: #172033;
      border-radius: 20px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .last-updated {
      font-size: 12px;
      color: #777;
      margin-top: 15px;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .controls {
        width: 100%;
      }

      .month-select {
        flex: 1;
      }

      .container {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>VJ PROCESS EXCELLENCE AI</h1>
    <p>Verma Jewellers — Process & Audit Management Dashboard</p>
  </div>

  <div class="container">

    <div class="top-bar">

      <h2>Monthly Audit Dashboard</h2>

      <div class="controls">

        <select class="month-select" id="monthSelect">
          <option value="2026-09">September 2026</option>
        </select>

        <button class="refresh-btn" onclick="loadDashboard()">
          Refresh
        </button>

      </div>

    </div>

    <div id="errorBox" class="error"></div>

    <div class="cards">

      <div class="card">
        <div class="card-title">TOTAL AUDITS</div>
        <div class="card-value" id="totalTarget">-</div>
      </div>

      <div class="card">
        <div class="card-title">COMPLETED</div>
        <div class="card-value" id="completed">-</div>
      </div>

      <div class="card">
        <div class="card-title">PENDING</div>
        <div class="card-value" id="pending">-</div>
      </div>

      <div class="card">
        <div class="card-title">COMPLETION</div>
        <div class="card-value" id="completion">-</div>
      </div>

    </div>

    <div class="section">

      <h3>Monthly Audit Plan</h3>

      <div id="loading" class="loading">
        Loading live data...
      </div>

      <div class="table-wrapper">

        <table id="auditTable" style="display:none;">

          <thead>
            <tr>
              <th>Audit Category</th>
              <th>Target</th>
              <th>Completed</th>
              <th>Pending</th>
              <th>Completion %</th>
              <th>Progress</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="auditTableBody"></tbody>

        </table>

      </div>

      <div class="last-updated" id="lastUpdated"></div>

    </div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzu-LJ_EXJwbCuK0zhc52C6Ptg41ORpID3jRDbBqkH1A-zAE4S1bazx1b1ZNeUA6J9a/exec";


    async function loadDashboard() {

      const loading = document.getElementById("loading");
      const table = document.getElementById("auditTable");
      const errorBox = document.getElementById("errorBox");

      loading.style.display = "block";
      table.style.display = "none";
      errorBox.style.display = "none";

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("API response failed");
        }

        const data = await response.json();

        if (!data.success) {
          throw new Error(
            data.error || "Unable to load dashboard data"
          );
        }

        updateSummary(data.summary);
        updateTable(data.plan);

        loading.style.display = "none";
        table.style.display = "table";

        document.getElementById("lastUpdated").innerText =
          "Last updated: " + new Date().toLocaleString();

      }

      catch (error) {

        loading.style.display = "none";

        errorBox.innerText =
          "Unable to load live dashboard data. Please refresh the page.";

        errorBox.style.display = "block";

        console.error(error);
      }

    }


    function updateSummary(summary) {

      document.getElementById("totalTarget").innerText =
        summary.totalTarget;

      document.getElementById("completed").innerText =
        summary.completed;

      document.getElementById("pending").innerText =
        summary.pending;

      document.getElementById("completion").innerText =
        summary.completion + "%";

    }


    function updateTable(plan) {

      const tbody =
        document.getElementById("auditTableBody");

      tbody.innerHTML = "";

      plan.forEach(item => {

        const row = document.createElement("tr");

        let statusClass = "completed";

        if (item.status === "In Progress") {
          statusClass = "progress";
        }

        if (item.status === "Not Started") {
          statusClass = "not-started";
        }

        row.innerHTML = `

          <td>${item.category}</td>

          <td>${item.target}</td>

          <td>${item.completed}</td>

          <td>${item.pending}</td>

          <td>${item.completion}%</td>

          <td>
            <div class="progress-bar">
              <div
                class="progress-fill"
                style="width:${Math.min(item.completion, 100)}%">
              </div>
            </div>
          </td>

          <td class="status ${statusClass}">
            ${item.status}
          </td>

        `;

        tbody.appendChild(row);

      });

    }


    loadDashboard();

  </script>

</body>
</html>
